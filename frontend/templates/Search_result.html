{% extends 'base.html' %}
{% block content %}

<form action="/handle_search" method="POST">
    <input type="text" id="query" name="query" ><br>
    <input type="submit" value="Search">
</form>

{% if found == 0 %}
  <p>no results found</p>
{% else %}
  {% for books in results %}
     <a href="/book_details/{{books['book_id']}}"><p>{{books['book_name']}} by {{books['author']}}</p></a>
  {% endfor %}
{% endif %}
{% endblock %}
